<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="70%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#9d7432" />
      <stop offset="30%" stop-color="#c59f5f" />
      <stop offset="60%" stop-color="#e2c68e" />
      <stop offset="85%" stop-color="#c59f5f" />
      <stop offset="100%" stop-color="#a67f3b" />
    </linearGradient>
    <linearGradient id="goldBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a67f3b" />
      <stop offset="50%" stop-color="#dcc18b" />
      <stop offset="100%" stop-color="#a67f3b" />
    </linearGradient>
  </defs>

  <style>
    .ssa-brand-letters {
      font-family: 'Cormorant Garamond', 'Didot', 'Bodoni MT', Georgia, serif;
      font-weight: 500;
      fill: #1a382d;
    }
    .ssa-family-text {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      letter-spacing: 0.38em;
      fill: #1a382d;
    }
    .ssa-motto-text {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      letter-spacing: 0.32em;
      font-size: 11.5px;
      fill: #1a382d;
    }
  </style>

  <!-- Group for Monogram SSA -->
  <g class="ssa-brand-letters" font-size="142">
    <!-- First S -->
    <text x="215" y="156" text-anchor="middle">S</text>
    <!-- Second S -->
    <text x="282" y="156" text-anchor="middle">S</text>
    <!-- A -->
    <text x="362" y="156" text-anchor="middle">A</text>
  </g>

  <!-- Golden Wave Swoosh across the S's to the A crossbar -->
  <path
    d="M 218 162 C 235 156, 252 142, 275 125 C 298 108, 322 101, 350 106 C 368 109, 386 116, 404 128 C 392 121, 376 115, 360 112 C 335 107, 313 113, 292 128 C 269 144, 248 158, 218 162 Z"
    fill="url(#goldGradient)"
  />

  <!-- FAMILY HOLDINGS Subtitle -->
  <text
    x="300"
    y="206"
    text-anchor="middle"
    font-size="28"
    class="ssa-family-text"
  >FAMILY HOLDINGS</text>

  <!-- Centered Gold Rule Line -->
  <line
    x1="268"
    y1="228"
    x2="332"
    y2="228"
    stroke="url(#goldBarGrad)"
    stroke-width="1.75"
    stroke-linecap="round"
  />

  <!-- Tagline: LONG-TERM CAPITAL. ENDURING VALUE. -->
  <text
    x="300"
    y="254"
    text-anchor="middle"
    class="ssa-motto-text"
  >LONG-TERM CAPITAL. ENDURING VALUE.</text>
</svg>
